<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Taker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Screenshot Taker</h1>

    <section class="card">
      <div class="input-row">
        <input type="text" id="url-input" placeholder="https://example.com" />
        <button id="capture-btn">Capture</button>
      </div>
      <div id="capture-error"></div>
      <div id="preview-area"></div>
    </section>

    <section class="card">
      <div class="gallery-header">
        <h2>Saved Screenshots</h2>
        <button id="refresh-btn">Refresh</button>
      </div>
      <div id="gallery-error"></div>
      <div id="cards-area"></div>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/errors.js"></script>
  <script src="service/Storageservice.js"></script>
  <script src="js/UrlValidator.js"></script>
  <script src="service/Screenshotservice.js"></script>
  <script src="js/Screenshot.js"></script>
  <script src="js/CaptureView.js"></script>
  <script src="js/GalleryView.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
